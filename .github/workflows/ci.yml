name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recover_version:
        description: Existing version whose tag was created before publishing finished
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_recovery:
    if: github.event_name == 'workflow_dispatch'
    name: Validate release recovery
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate recovery target
        id: validate
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.recover_version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release recovery must run from main (got: $GITHUB_REF)" >&2
            exit 1
          fi
          if [[ ! "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "recover_version must be a stable semantic version" >&2
            exit 1
          fi

          version="$RAW_VERSION"
          tag="v${version}"
          current_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$current_version" != "$version" ]]; then
            echo "main VERSION is $current_version, not recovery version $version" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "recovery tag $tag does not exist" >&2
            exit 1
          fi

          tagged_version="$(git show "${tag}:VERSION" | tr -d '[:space:]')"
          if [[ "$tagged_version" != "$version" ]]; then
            echo "$tag contains VERSION $tagged_version, not $version" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
            echo "$tag is not an ancestor of recovery main $GITHUB_SHA" >&2
            exit 1
          fi

          # Recovery publishes the repaired podspec from main against the
          # immutable tagged sources. Only delivery metadata may differ.
          if ! git diff --quiet "$tag_commit" "$GITHUB_SHA" -- LICENSE PutioSDK podspec_helper.rb; then
            echo "CocoaPods source payload changed after $tag; recovery requires a new release" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: Verify Swift SDK
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ github.workflow }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ github.workflow }}-

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Example/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ github.workflow }}-${{ hashFiles('Example/Podfile.lock', 'PutioSDK.podspec', 'podspec_helper.rb') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{ github.workflow }}-

      - name: Bootstrap repository
        run: make bootstrap

      - name: Verify repository
        run: make verify

      - name: Verify tvOS and watchOS platforms
        run: make verify-platforms

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    name: Release Swift SDK
    needs:
      - verify
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment:
      name: release
      deployment: false
    permissions:
      contents: read

    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Resolve release bot identity
        id: release-bot-identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          APP_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          if ! user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot] (got: ${user_id})" >&2
            exit 1
          fi
          echo "user_id=${user_id}" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ github.workflow }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-${{ github.workflow }}-

      - name: Restore CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ github.workflow }}-${{ hashFiles('Example/Podfile.lock', 'PutioSDK.podspec', 'podspec_helper.rb') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{ github.workflow }}-

      - name: Bootstrap repository
        run: make bootstrap

      - name: Configure release bot remote
        run: git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          RELEASE_BOT_TOKEN: ${{ steps.release-bot.outputs.token }}

      - name: Release SDK
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.8
            @semantic-release/git@10.0.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-bot-identity.outputs.user_id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-bot-identity.outputs.user_id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com

  recover_release:
    if: github.event_name == 'workflow_dispatch'
    name: Recover Swift SDK release
    needs:
      - validate_recovery
      - verify
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment:
      name: release
      deployment: false
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version

      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle config set --local frozen true
          make bootstrap

      - name: Publish missing CocoaPods version
        shell: bash
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          VERSION: ${{ needs.validate_recovery.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$COCOAPODS_TRUNK_TOKEN" ]]; then
            echo "COCOAPODS_TRUNK_TOKEN is required for release recovery" >&2
            exit 1
          fi
          ./scripts/publish-cocoapods.sh "$VERSION"

      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create missing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAG: ${{ needs.validate_recovery.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub Release"
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          git log -1 --format=%b "${TAG}^{commit}" > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "$TAG has no release notes in its commit message" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes_file"
